[project]
name = "aurora-coqui-worker"
version = "0.1.0"
description = "Ambiente Python do worker experimental Coqui XTTS (CPU), gerenciado com uv."
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "coqui-tts==0.28.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
