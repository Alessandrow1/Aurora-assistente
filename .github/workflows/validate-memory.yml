name: Validate Aurora local voice and memory

on:
  push:
    branches: [feature/live2d-avatar]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/validate-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Prepare offline Silero and ONNX Runtime assets
        run: node scripts/copy-voice-assets.cjs
      - name: Check Electron JavaScript syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/aurora-local-tts.cjs
      - name: Run memory, image, voice and asset tests
        run: npm test
