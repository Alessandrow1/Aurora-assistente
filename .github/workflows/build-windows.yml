name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.ts'
      - '*.json'
      - '*.bat'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: aurora-windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download anime VRM asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public/models | Out-Null
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/GY19A/jev-stage/main/static/vrm/anime_girl.vrm' `
            -OutFile 'public/models/aurora-anime.vrm'

      - name: Check Electron scripts
        run: node --check electron/main.cjs && node --check electron/preload.cjs

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
