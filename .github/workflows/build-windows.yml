name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, feature/live2d-avatar]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '*.ts'
      - '*.json'
      - '*.bat'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: aurora-windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Package complete source ZIP
        shell: pwsh
        run: |
          $excluded = @('.git', 'node_modules', 'dist', 'release', 'Aurora-assistente-source.zip')
          $items = Get-ChildItem -Force | Where-Object { $_.Name -notin $excluded }
          Compress-Archive -Path $items.FullName -DestinationPath 'Aurora-assistente-source.zip' -CompressionLevel Optimal -Force

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Source-Code
          path: Aurora-assistente-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Check Electron scripts
        run: node --check electron/main.cjs && node --check electron/preload.cjs

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
